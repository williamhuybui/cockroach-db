<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Number</title>
</head>
<body>
  <h1>Random Number</h1>
  <p id="number">Loading...</p>
  <button onclick="getNumber()">Get another number</button>

  <script>
    async function getNumber() {
      const res = await fetch("/api/random");
      const data = await res.json();
      document.getElementById("number").textContent = data.number;
    }

    getNumber();
  </script>
</body>
</html>

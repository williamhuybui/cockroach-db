<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <title>Live calls — Openline AI</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/ui.css">
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <div class="app-shell live-shell">
    <header class="topbar">
      <a class="brand" href="/dashboard" title="Back to dashboard"><span class="brand-icon">☎</span> Openline AI <span class="brand-sub">Live calls</span></a>
      <div class="topbar-right">
        <a class="home-link" href="/dashboard" target="frontdesk_dashboard">← Dashboard</a>
        <span id="clock" class="clock"></span>
      </div>
    </header>

    <main class="content">
      <div class="live-header">
        <h2>Live calls</h2>
        <span class="pill" id="live-connection-pill">Connecting…</span>
      </div>
      <!-- Filled by renderLiveView() — either the standby state or one card
           per call in live_calls.py's registry. -->
      <div id="live-content"></div>
    </main>
  </div>

  <div class="toast-host" id="toast-host" aria-live="polite"></div>

  <script src="/static/live.js"></script>
</body>
</html>
